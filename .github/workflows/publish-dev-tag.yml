name: Publish Dev Tag

# Publie rapidement un instantané de `develop` vers rct-nexus, sans passer par
# le cycle gitflow complet (develop -> main + bump de version + tag de
# release, cf. build-and-publish.yml). Exemple : develop en 1.0.0-SNAPSHOT
# publie sous le tag "1.0.0-dev".
#
# Le tag "<version>-dev" est un pointeur MOBILE : chaque déclenchement le
# déplace sur le dernier commit de develop et republie le fat JAR sous ce même
# identifiant de version (donc écrase l'artefact précédent sur rct-nexus). Il
# suffit ensuite de faire pointer ONEROSTER_VERSION (starter/.env* et
# helm/openent-monolithe/values.yaml, côté open-ent-mods) sur "1.0.0-dev" pour
# déployer rapidement — sans re-release complète tant que develop reste sur la
# même version -SNAPSHOT.
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-dev-tag:
    name: Tag & Publish Dev Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: develop

      - name: Vérifier que develop est bien la branche déclenchante
        run: |
          if [ "${{ github.ref }}" != "refs/heads/develop" ]; then
            echo "::error::Ce workflow doit être déclenché depuis la branche develop (reçu: ${{ github.ref }})"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Configure Maven pour GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>$GITHUB_ACTOR</username>
                <password>$GITHUB_TOKEN</password>
              </server>
              <server>
                <id>pt-releases</id>
                <username>$NEXUS_USER</username>
                <password>$NEXUS_PASSWORD</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Calculer la version dev (ex. 1.3.0-SNAPSHOT -> 1.3.0-dev)
        id: version
        run: |
          RAW_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          DEV_VERSION="${RAW_VERSION%-SNAPSHOT}-dev"
          echo "dev=${DEV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version develop: ${RAW_VERSION} -> tag dev: ${DEV_VERSION}"

      - name: Créer/déplacer le tag ${{ steps.version.outputs.dev }}
        env:
          TAG: ${{ steps.version.outputs.dev }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git tag -a "$TAG" -m "Build dev depuis develop@${GITHUB_SHA::8}"
          git push origin "refs/tags/$TAG"

      - name: Fixer la version Maven à ${{ steps.version.outputs.dev }} (non committée)
        env:
          DEV_VERSION: ${{ steps.version.outputs.dev }}
        run: mvn -q -B org.codehaus.mojo:versions-maven-plugin:2.16.2:set -DnewVersion="${DEV_VERSION}" -DgenerateBackupPoms=false

      - name: Build fat JAR
        run: mvn clean package -DskipTests -B -DbuildNumber=${GITHUB_SHA::8} -DscmBranch=develop

      - name: Publish fat JAR to rct-nexus
        continue-on-error: true
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          cat > /tmp/nx-settings.xml <<EOF
          <settings><servers><server><id>pt-releases</id><username>${NEXUS_USER}</username><password>${NEXUS_PASSWORD}</password></server></servers></settings>
          EOF
          FAT_JAR=$(ls target/*-fat.jar 2>/dev/null | head -1)
          if [ -z "${FAT_JAR}" ]; then echo "::error::Fat JAR not found"; exit 1; fi
          FAT_ABS=$(realpath "${FAT_JAR}")
          BASE=$(basename "${FAT_JAR}" -fat.jar)
          GROUP_ID=${BASE%%~*}; REST=${BASE#*~}; ARTIFACT_ID=${REST%%~*}; VERSION=${REST#*~}
          echo "Deploying ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}:fat -> rct-nexus (maven-releases)"
          cd /tmp
          mvn deploy:deploy-file -s /tmp/nx-settings.xml -Dfile="${FAT_ABS}" -DgroupId="${GROUP_ID}" -DartifactId="${ARTIFACT_ID}" -Dversion="${VERSION}" -Dclassifier=fat -Dpackaging=jar -DrepositoryId=pt-releases -Durl="https://rct-nexus.tech.fr/repository/maven-releases/" -B

      - name: Publish fat JAR to GitHub Packages
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV_VERSION: ${{ steps.version.outputs.dev }}
        run: |
          FAT_JAR=$(ls target/*-fat.jar 2>/dev/null | head -1)
          if [ -z "${FAT_JAR}" ]; then echo "::error::Fat JAR not found"; exit 1; fi
          mvn deploy:deploy-file \
            -Dfile="${FAT_JAR}" \
            -DgroupId="fr.openent" \
            -DartifactId="oneroster" \
            -Dversion="${DEV_VERSION}" \
            -Dclassifier=fat \
            -Dpackaging=jar \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${{ github.repository }}" \
            -B

      - name: Nettoyer les anciennes GitHub Releases pour ce tag mobile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.dev }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\") | .id"); do
            echo "Suppression de la release existante $id pour le tag $TAG"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id" || true
          done

      - name: Créer/mettre à jour la GitHub Release (pré-version)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.dev }}
          name: ${{ steps.version.outputs.dev }}
          prerelease: true
          files: target/*-fat.jar
